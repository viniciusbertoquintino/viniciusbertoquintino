[project]
name = "production-rag"
version = "0.1.0"
description = "Production-oriented RAG system with retrieval evaluation, observability, and deployability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.55",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "qdrant-client>=1.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external services such as local Qdrant",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]
